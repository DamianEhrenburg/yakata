name: Release builds

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs: 
  windows:
    name: Windows exe/msi
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2

      - name: Run unit tests
        run: cargo test

      - name: Run Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Install Dioxus CLI
        run: cargo install --locked dioxus-cli

      - name: Install packing tools
        run: |
          choco install nsis -y

      - name: Build Windows bundles
        run: |
          dx bundle --release --platform windows --package-types nsis

      - name: Prepare Windows artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path staging -Force | Out-Null
          $setup = Get-ChildItem -Path target/dx -Filter "*setup.exe" -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $setup) {
            $setup = Get-ChildItem -Path target/dx -Filter "*.exe" -Recurse -ErrorAction SilentlyContinue | Where-Object { $_.FullName -like "*nsis*" } | Select-Object -First 1
          }
          if (-not $setup) {
            Write-Error "NSIS setup executable was not found in target/dx"
            exit 1
          }
          Copy-Item $setup.FullName -Destination "staging/Yakata-Setup.exe"

          $appExe = Get-ChildItem -Path target/dx -Filter "*.exe" -Recurse -ErrorAction SilentlyContinue | Where-Object { $_.FullName -like "*release*windows*app*" } | Select-Object -First 1
          if (-not $appExe) {
            Write-Error "Release application executable was not found in target/dx"
            exit 1
          }

          $appDir = $appExe.DirectoryName
          New-Item -ItemType Directory -Path portable_tmp -Force | Out-Null
          Copy-Item "$appDir/*" -Destination "portable_tmp" -Recurse
          New-Item -ItemType File -Path "portable_tmp/portable.txt" -Force | Out-Null
          Compress-Archive -Path "portable_tmp/*" -DestinationPath "staging/Yakata-Portable.zip" -Force
          Remove-Item -Path "portable_tmp" -Recurse -Force

          $checksums = @()
          foreach ($file in @("Yakata-Setup.exe", "Yakata-Portable.zip")) {
            $hash = (Get-FileHash -Path "staging/$file" -Algorithm SHA256).Hash.ToLowerInvariant()
            $checksums += "$hash  $file"
          }
          Set-Content -Path "staging/SHA256SUMS.txt" -Value $checksums -Encoding utf8NoBOM

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: yakata-windows
          path: staging/*

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: staging/*
          name: Yakata ${{ github.ref_name }}
          generate_release_notes: true
