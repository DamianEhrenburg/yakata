name: Release builds

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs: 
  windows:
    name: Windows exe/msi
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Run unit tests
        run: cargo test

      - name: Install Dioxus CLI
        run: cargo install --locked dioxus-cli

      - name: Install packing tools
        run: |
          choco install nsis -y

      - name: Build Windows bundles
        run: |
          dx bundle --release --platform windows --package-types nsis

      - name: Prepare Windows artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path staging -Force
          $setup = Get-ChildItem -Path target/dx -Filter "*setup.exe" -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $setup) {
            $setup = Get-ChildItem -Path target/dx -Filter "*.exe" -Recurse -ErrorAction SilentlyContinue | Where-Object { $_.FullName -like "*nsis*" } | Select-Object -First 1
          }
          if ($setup) {
            Copy-Item $setup.FullName -Destination "staging/Yakata-Setup.exe"
          }
          $appExe = Get-ChildItem -Path target/dx -Filter "*.exe" -Recurse -ErrorAction SilentlyContinue | Where-Object { $_.FullName -like "*release*windows*app*" } | Select-Object -First 1
          if ($appExe) {
            $appDir = $appExe.DirectoryName
            Compress-Archive -Path "$appDir/*" -DestinationPath "staging/Yakata-Portable.zip" -Force
          }

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: yakata-windows
          path: staging/*

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: staging/*
          name: Yakata ${{ github.ref_name }}
          body: |
            ### What's new

            - Windows process tree tracking across game launchers and engine wrappers
            - Locale Emulator (LEProc) support and Shift-JIS path detection
            - Dark interface with responsive grid, custom dropdowns, and VNDB spoiler tags
            - Two-column Add VN modal with live VNDB search preview
            - Route progress tracking, novel notes, and Discord Rich Presence
            - Blur filter for 18+ adult covers with reveal on hover
            - NSIS installer and standalone portable zip builds
