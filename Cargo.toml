[package]
name = "yakata"
version = "0.2.0"
authors = ["Damian Ehrenburg"]
edition = "2024"

[dependencies]
dioxus = { version = "0.7.10", features = ["router"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "6"
reqwest = { version = "0.13.4", features = ["json"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
chrono = { version = "0.4.41", features = ["serde"] }
rfd = "0.17.2"
discord-rich-presence = "1.1.0"
base64 = "0.22.1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Diagnostics_ToolHelp", "Win32_System_Threading"] }

[target.'cfg(windows)'.build-dependencies]
winres = "0.1"

[features]
default = ["desktop"]
web = ["dioxus/web"]
desktop = ["dioxus/desktop"]
mobile = ["dioxus/mobile"]

[package.metadata.packager]
product-name = "Yakata"
identifier = "com.damian.yakata"
icons = ["assets/favicon.png", "assets/favicon.ico"]
